services:
  - type: web
    name: library-management-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://library-management-system.onrender.com
    healthCheckPath: /api/health